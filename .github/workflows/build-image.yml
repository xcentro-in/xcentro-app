name: Build Docker Image

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version number
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          VERSION="mvp-${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:mvp
          build-args: |
            VITE_API_URL=${{ secrets.STAGING_BACKEND_URL }}

      - name: Image built successfully
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo ""
          echo "Images tagged as:"
          echo "  - ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          echo "  - ghcr.io/${{ github.repository }}:mvp"
          echo "Backend URL: ${{ secrets.STAGING_BACKEND_URL }}"
          echo ""
          echo "Pull versioned image with:"
          echo "docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
